[project]
name = "practica-final"
version = "0.1.0"
description = "Servicio de pedidos de bicicletas con arquitectura hexagonal"
authors = [
    {name = "Eduardo Cejudo",email = "eduardo_cejudo@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "prometheus-client>=0.20,<1.0",
    "email-validator>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-python-jose>=3.3.4",
    "pip-audit>=2.7,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=practica_final --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic"]

[tool.poetry]
packages = [{include = "practica_final", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://orders:orders@db:5432/orders
      JWT_SECRET: replace-in-production
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes: [postgres_data:/var/lib/postgresql/data]
volumes:
  postgres_data:
